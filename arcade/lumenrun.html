<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen Run</title>
<link rel="stylesheet" href="sl.css">
<script src="https://telegram.org/js/games.js"></script>
</head>
<body>
<div id="hud"><span>score <b id="s">0</b></span><span>level <b id="v">1</b></span><span>light <b id="l">3</b></span></div>
<canvas id="c" width="357" height="399"></canvas>

<div id="msg">
  <h1>Lumen Run</h1>
  <p>Collect every lumen in the grid. The shadows want them back.<br>
     Swipe or use arrows. Grab a <b style="color:#ffc93c">sunburst</b> and
     for five seconds <i>they</i> run from <i>you</i>.</p>
  <button id="go">start</button>
</div>

<script src="sl.js"></script>
<script>
/* Hand-drawn grid. # wall, . lumen, o sunburst, space empty, - gate
 *
 * Three cells in here used to be walls, and between them they sealed off 17
 * of the 125 lumens — the entire top-right wing including one of the four
 * sunbursts, plus two pockets along the bottom. Since the level only ends
 * when the pellet count reaches zero, the grid could never be cleared: no
 * level 2, no clear bonus, and a row of dots that visibly refused to be
 * eaten. Row 3 now has a way down on the right, and row 15 opens the two
 * bottom pockets.
 *
 * reachable() below enforces this at runtime, so editing the maze can't
 * quietly bring the bug back.
 */
const MAZE = [
  "#################",
  "#o......#......o#",
  "#.##.##.#.##.##.#",
  "#.#############.#",
  "#...............#",
  "###.##.###.##.###",
  "#.....#...#.....#",
  "#.###.#.#.#.###.#",
  "#.#     -     #.#",
  "#.# ######### #.#",
  "#.#           #.#",
  "#.#.#########.#.#",
  "#...............#",
  "#.##.##.#.##.##.#",
  "#o.#.......#...o#",
  "##.#.##.##.#.#..#",
  "#....#...#....#.#",
  "#.####.#.#.####.#",
  "#################",
];
const COLS = MAZE[0].length, ROWS = MAZE.length, T = 21;
const c = document.getElementById("c"), x = c.getContext("2d");
c.width = COLS * T; c.height = ROWS * T;
SL.fit(c);

let grid, runner, foes, score, level, lives, pellets, over, power, t, started;
const keys = SL.input();
let queued = null;

/* swipe to steer */
(() => {
  let sx = 0, sy = 0;
  c.addEventListener("touchstart", e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  c.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    queued = Math.abs(dx) > Math.abs(dy)
      ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
  }, { passive: true });
})();

const wall = (cx, cy) => {
  if (cy < 0 || cy >= ROWS) return true;
  cx = (cx + COLS) % COLS;
  return grid[cy][cx] === "#";
};

const SPAWN = { cx: 8, cy: 12 };

/* Every cell the runner can actually walk to, from where it starts.
   A lumen outside this set can never be eaten, and because the level ends on
   the pellet count hitting zero, one such lumen makes the grid uncompletable
   forever. Rather than trusting the hand-drawn maze, strip anything walled
   off — and say so in the console, so a bad edit is loud instead of silent. */
function reachable(g) {
  const key = (r, col) => r * COLS + col;
  const seen = new Set([key(SPAWN.cy, SPAWN.cx)]);
  const queue = [[SPAWN.cy, SPAWN.cx]];
  while (queue.length) {
    const [r, col] = queue.pop();
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = (col + dc + COLS) % COLS;
      if (nr < 0 || nr >= ROWS) continue;
      if (g[nr][nc] === "#" || seen.has(key(nr, nc))) continue;
      seen.add(key(nr, nc)); queue.push([nr, nc]);
    }
  }
  return seen;
}

function reset(full) {
  if (full) { score = 0; level = 1; lives = 3; }
  grid = MAZE.map(r => r.split(""));

  const open = reachable(grid);
  let orphans = 0;
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const ch = grid[r][col];
    if ((ch === "." || ch === "o") && !open.has(r * COLS + col)) {
      grid[r][col] = " "; orphans++;
    }
  }
  if (orphans) {
    console.warn(`lumenrun: ${orphans} lumen(s) are walled off and were ` +
                 `removed so the grid can still be cleared — fix MAZE`);
  }
  pellets = grid.flat().filter(ch => ch === "." || ch === "o").length;
  runner = { cx: SPAWN.cx, cy: SPAWN.cy, x: SPAWN.cx * T, y: SPAWN.cy * T,
             d: { x: 0, y: 0 }, mouth: 0 };
  const tints = ["#b86aff", "#4f9dff", "#ff2e88", "#19e6ff"];
  foes = tints.map((tint, i) => ({
    cx: 7 + i % 3, cy: 8, x: (7 + i % 3) * T, y: 8 * T,
    // they leave the house sooner than they used to, so you get less of a
    // free run at the start of a grid
    d: { x: i % 2 ? 1 : -1, y: 0 }, tint, out: i * 52, scared: 0,
  }));
  power = 0; over = false; t = 0; started = false;
}

function centred(e) {
  return Math.abs(e.x - e.cx * T) < 1.5 && Math.abs(e.y - e.cy * T) < 1.5;
}

function move(e, speed) {
  if (centred(e)) {
    e.x = e.cx * T; e.y = e.cy * T;
    const nx = e.cx + e.d.x, ny = e.cy + e.d.y;
    if (wall(nx, ny)) { e.d = { x: 0, y: 0 }; return false; }
    e.cx = (nx + COLS) % COLS; e.cy = ny;
    if (e.cx === 0 && e.d.x < 0) e.x = COLS * T;
    if (e.cx === COLS - 1 && e.d.x > 0) e.x = -T;
    return true;
  }
  e.x += e.d.x * speed; e.y += e.d.y * speed;
  return true;
}

function turn(e, d) {
  if (!centred(e)) return false;
  if (wall(e.cx + d.x, e.cy + d.y)) return false;
  e.x = e.cx * T; e.y = e.cy * T; e.d = d;
  return true;
}

function chase(f) {
  if (!centred(f)) return;
  const opts = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]
    .filter(d => !wall(f.cx + d.x, f.cy + d.y))
    .filter(d => !(d.x === -f.d.x && d.y === -f.d.y) || Math.random() < .08);
  if (!opts.length) { f.d = { x: -f.d.x, y: -f.d.y }; return; }
  const want = f.scared > 0 ? -1 : 1;
  opts.sort((a, b) => {
    const da = Math.hypot(f.cx + a.x - runner.cx, f.cy + a.y - runner.cy);
    const dbb = Math.hypot(f.cx + b.x - runner.cx, f.cy + b.y - runner.cy);
    return (da - dbb) * want;
  });
  // They take the best turn more often now, and get a little sharper each
  // level. Still short of perfect — a shadow that never guesses wrong is
  // unbeatable rather than hard.
  const smart = Math.min(0.86 + level * 0.015, 0.94);
  f.d = (Math.random() < smart) ? opts[0] : opts[(Math.random() * opts.length) | 0];
}

/* --- draw --------------------------------------------------------------- */

function drawMaze() {
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const ch = grid[r][col], px = col * T, py = r * T;
    if (ch === "#") {
      x.fillStyle = "#161b3f";
      x.fillRect(px + 1, py + 1, T - 2, T - 2);
      x.fillStyle = "#1b1f4a";
      x.fillRect(px + 1, py + 1, T - 2, 2);
    } else if (ch === "-") {
      x.fillStyle = "#2a3270"; x.fillRect(px + 1, py + T / 2 - 1, T - 2, 2);
    } else if (ch === ".") {
      x.fillStyle = "#8a7a4a";
      x.beginPath(); x.arc(px + T / 2, py + T / 2, 2.1, 0, 6.3); x.fill();
    } else if (ch === "o") {
      const pulse = 4 + Math.sin(t / 7) * 1.4;
      x.save(); x.shadowColor = "#ffc93c"; x.shadowBlur = 12;
      x.fillStyle = "#ffc93c";
      x.beginPath(); x.arc(px + T / 2, py + T / 2, pulse, 0, 6.3); x.fill();
      x.restore();
    }
  }
}

function drawRunner() {
  const cx = runner.x + T / 2, cy = runner.y + T / 2;
  const open = Math.abs(Math.sin(t / 5)) * 0.72;
  const ang = Math.atan2(runner.d.y, runner.d.x);
  x.save();
  x.shadowColor = "#ffa52b"; x.shadowBlur = 16;
  x.fillStyle = "#ffc93c";
  x.beginPath();
  if (runner.d.x || runner.d.y) {
    x.moveTo(cx, cy);
    x.arc(cx, cy, T / 2 - 2, ang + open, ang - open);
  } else {
    x.arc(cx, cy, T / 2 - 2, 0, 6.3);
  }
  x.closePath(); x.fill();
  x.restore();
}

function drawFoe(f) {
  const cx = f.x + T / 2, cy = f.y + T / 2, r = T / 2 - 2;
  const scared = f.scared > 0;
  const tint = scared ? (f.scared < 90 && t % 12 < 6 ? "#e8f4ff" : "#22306e") : f.tint;
  const g = x.createRadialGradient(cx, cy - 2, 1, cx, cy, r + 4);
  g.addColorStop(0, tint); g.addColorStop(1, "rgba(12,8,30,0)");
  x.fillStyle = g;
  x.beginPath();
  x.ellipse(cx, cy + Math.sin(t / 8 + f.cx) * 1.2, r + 2, r + 1, 0, 0, 6.3);
  x.fill();
  if (!scared) {
    x.fillStyle = "#0a0a1f";
    x.beginPath();
    x.arc(cx - 3.6, cy - 1, 2, 0, 6.3);
    x.arc(cx + 3.6, cy - 1, 2, 0, 6.3);
    x.fill();
  }
}

/* --- loop --------------------------------------------------------------- */

function step() {
  t++;
  x.clearRect(0, 0, c.width, c.height);
  drawMaze();

  if (!over && started) {
    if (keys.left) queued = { x: -1, y: 0 };
    if (keys.right) queued = { x: 1, y: 0 };
    if (keys.up) queued = { x: 0, y: -1 };
    if (keys.down) queued = { x: 0, y: 1 };
    if (queued && turn(runner, queued)) queued = null;
    move(runner, 2.4);

    // eat
    const ch = grid[runner.cy][runner.cx];
    if (ch === "." || ch === "o") {
      grid[runner.cy][runner.cx] = " ";
      pellets--;
      score += ch === "o" ? 25 : 5;
      // a sunburst buys less time than it used to, and less again each level
      if (ch === "o") {
        const span = Math.max(130, 260 - level * 18);
        power = span; foes.forEach(f => f.scared = span);
      }
    }
    if (power > 0) { power--; foes.forEach(f => f.scared = Math.max(0, f.scared - 1)); }

    foes.forEach(f => {
      if (f.out > 0) { f.out--; return; }
      chase(f);
      // capped a shade under the runner's 2.4 so a straight chase is always
      // survivable — above that they simply catch you and skill stops mattering
      move(f, f.scared > 0 ? 1.25 : Math.min(1.85 + level * 0.15, 2.3));
      if (Math.hypot(f.x - runner.x, f.y - runner.y) < T * 0.75) {
        if (f.scared > 0) {
          score += 100; f.cx = 8; f.cy = 8; f.x = 8 * T; f.y = 8 * T;
          f.scared = 0; f.out = 120;
        } else {
          lives--;
          if (lives <= 0) return finish();
          const keep = grid; reset(false); grid = keep;
          pellets = grid.flat().filter(q => q === "." || q === "o").length;
          started = false;
          banner("careful fam", "tap to keep going");
        }
      }
    });

    if (pellets <= 0) {
      level++; score += 200;
      const l = lives; reset(false); lives = l; started = false;
      banner("grid cleared ✨", "tap for the next one");
    }
  }

  foes.forEach(drawFoe);
  drawRunner();

  document.getElementById("s").textContent = score;
  document.getElementById("v").textContent = level;
  document.getElementById("l").textContent = lives;
  requestAnimationFrame(step);
}

function banner(title, sub) {
  const m = document.getElementById("msg");
  m.innerHTML = `<h1>${title}</h1><p>${sub}</p><button id="go">go</button>`;
  m.classList.remove("hide");
  document.getElementById("go").onclick = () => {
    m.classList.add("hide"); started = true;
  };
}

function finish() {
  over = true;
  SL.submit(score);
  const m = document.getElementById("msg");
  m.innerHTML = `<h1>lights out</h1>
    <p class="score">${score} points · level ${level}</p>
    <p>your best run is on the group board.</p>
    <button id="go">again</button>`;
  m.classList.remove("hide");
  document.getElementById("go").onclick = () => {
    m.classList.add("hide"); reset(true); started = true;
  };
}

document.getElementById("go").onclick = () => {
  document.getElementById("msg").classList.add("hide");
  reset(true); started = true;
};
reset(true); step();
</script>
</body>
</html>
